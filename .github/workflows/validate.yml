name: validate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dotsettings:
    name: Validate shared ReSharper layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Self-test the validator
        run: python tools/test_validate_dotsettings.py

      - name: Validate *.DotSettings
        run: python tools/validate_dotsettings.py

  build-props:
    name: Validate the shared NuGet audit pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Self-test the validator
        run: python tools/test_validate_build_props.py

      - name: Validate Directory.Build.props and .targets
        run: python tools/validate_build_props.py

  packaging:
    name: Build the packaging fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and pack tools/fixtures in Release and assert the outputs
        run: python tools/test_fixtures.py

  editorconfig-mirror:
    name: Build the opt-in .editorconfig mirror consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build consumers with and without the switch and assert the copy
        run: python tools/test_editorconfig_mirror.py

  analyzers-corpus:
    name: Check the analyzers corpus against the ERROR inspections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Self-test the checker and check analyzers-corpus/expected.json
        run: python tools/test_validate_analyzers_corpus.py
