name: validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  dotsettings:
    name: Validate shared ReSharper layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Self-test the validator
        run: python tools/test_validate_dotsettings.py

      - name: Validate *.DotSettings
        run: python tools/validate_dotsettings.py

  build-props:
    name: Validate the shared NuGet audit pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Self-test the validator
        run: python tools/test_validate_build_props.py

      - name: Validate Directory.Build.props and .targets
        run: python tools/validate_build_props.py

  packaging:
    name: Build the packaging fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and pack tools/fixtures in Release and assert the outputs
        run: python tools/test_fixtures.py

  editorconfig-mirror:
    name: Build the opt-in .editorconfig mirror consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Build consumers with and without the switch and assert the copy
        run: python tools/test_editorconfig_mirror.py

  fex-analyzers:
    name: Build the FEx.Analyzers consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Build consumers with and without the opt-out and assert the rules at error and the pin
        run: python tools/test_fex_analyzers.py

  nuget-audit:
    name: Build a consumer with a vulnerable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Build consumers with a patched and a vulnerable package and assert the build fails on NU1903 and NU1904
        run: python tools/test_nuget_audit.py

  analyzers-corpus:
    name: Check the analyzers corpus against the ERROR inspections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Self-test the checker
        run: python tools/test_validate_analyzers_corpus.py

      - name: Check analyzers-corpus/expected.json against the corpus and the ERROR inspections
        run: python tools/validate_analyzers_corpus.py

  roslyn-parity:
    name: Hold the Roslyn analyzers to the ReSharper verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Self-test the gate
        run: python tools/test_validate_roslyn_parity.py

      - name: Compare the Roslyn verdicts on the corpus with analyzers-corpus/expected.json
        run: python tools/validate_roslyn_parity.py --json "$RUNNER_TEMP/roslyn-parity.json"

      - name: Keep the verdict of every inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roslyn-parity
          path: ${{ runner.temp }}/roslyn-parity.json
          if-no-files-found: ignore

  workflows:
    name: Check that every workflow is hardened
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Self-test the checker
        run: python tools/test_validate_workflows.py

      - name: Check .github/workflows
        run: python tools/validate_workflows.py
